name: Android CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-tests:
    # Header-only native helpers (PCM decode, rate resolution, Pioneer route tables, channel
    # activity, waveform math) build with the host compiler; no NDK needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native tests
        run: cmake -S app/src/test/cpp -B build/native-tests -DCMAKE_BUILD_TYPE=Debug
      - name: Build native tests
        run: cmake --build build/native-tests --parallel
      - name: Run native tests
        run: ctest --test-dir build/native-tests --output-on-failure

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Prepare Gradle wrapper
        run: chmod +x gradlew
      - name: Install native toolchain
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Lint, test, and build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --console=plain
